<!DOCTYPE html>
{% extends "base.html" %}
{% block title %}TradeFlow — Session Expired{% endblock %}
{% block body %}
<div style="min-height: calc(100vh - 56px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px;">
    <div style="font-family:var(--font-mono); font-size:4rem; font-weight:600; color:var(--border-accent); letter-spacing:-0.04em; line-height:1; margin-bottom:24px;">⏱</div>
    <div style="font-family:var(--font-mono); font-size:1rem; color:var(--text-primary); margin-bottom:8px;">Session expired</div>
    <p style="font-size:0.875rem; color:var(--text-muted); max-width:400px; margin-bottom:12px;">
        {{ error or "Your session data has expired or was not found." }}
    </p>
    <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:32px;">
        Please re-upload your tradebook to regenerate the report.
    </p>
    <a href="/" class="btn btn-primary">← Upload Again</a>
</div>
{% endblock %}
