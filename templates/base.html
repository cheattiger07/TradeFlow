<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TradeFlow{% endblock %}</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
 
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
        :root {
            --bg-primary:    #0a0c10;
            --bg-secondary:  #111318;
            --bg-card:       #13161d;
            --bg-hover:      #1a1e28;
 
            --border:        #1e2330;
            --border-accent: #2a3047;
 
            --text-primary:  #e8eaf0;
            --text-secondary:#8890a4;
            --text-muted:    #4a5168;
 
            --green:         #00d4aa;
            --green-dim:     #00d4aa22;
            --red:           #ff4d6a;
            --red-dim:       #ff4d6a22;
            --amber:         #f5a623;
            --amber-dim:     #f5a62322;
            --blue:          #4d9fff;
            --blue-dim:      #4d9fff18;
 
            --accent:        #5c7cfa;
            --accent-dim:    #5c7cfa18;
 
            --font-mono: 'IBM Plex Mono', monospace;
            --font-sans: 'IBM Plex Sans', sans-serif;
 
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }
 
        html { font-size: 15px; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 400;
            line-height: 1.6;
            min-height: 100vh;
        }
 
        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 3px; }
 
        /* ── Navbar ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .navbar-logo {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
        }
        .navbar-logo svg { width: 16px; height: 16px; fill: #fff; }
        .navbar-name {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.04em;
        }
        .navbar-tag {
            font-size: 0.7rem;
            color: var(--accent);
            font-family: var(--font-mono);
            padding: 2px 7px;
            border: 1px solid var(--accent-dim);
            border-radius: 3px;
            letter-spacing: 0.08em;
        }
        .navbar-right { display: flex; align-items: center; gap: 16px; }
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            transition: color 0.15s;
        }
        .nav-link:hover { color: var(--text-primary); }
 
        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover { background: #7b96ff; border-color: #7b96ff; }
        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border-accent);
        }
        .btn-outline:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
        .btn-green {
            background: var(--green-dim);
            color: var(--green);
            border-color: #00d4aa33;
        }
        .btn-green:hover { background: #00d4aa33; }
        .btn-red {
            background: var(--red-dim);
            color: var(--red);
            border-color: #ff4d6a33;
        }
        .btn-red:hover { background: #ff4d6a33; }
        .btn-sm { padding: 6px 13px; font-size: 0.8rem; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
 
        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
        }
        .card-sm { padding: 14px 18px; }
 
        /* ── Metric card ── */
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
        }
        .metric-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .metric-value {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .metric-value.positive { color: var(--green); }
        .metric-value.negative { color: var(--red); }
        .metric-accent-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: var(--border-accent);
        }
        .metric-accent-bar.green { background: var(--green); opacity: 0.5; }
        .metric-accent-bar.red   { background: var(--red);   opacity: 0.5; }
        .metric-accent-bar.blue  { background: var(--blue);  opacity: 0.5; }
        .metric-accent-bar.amber { background: var(--amber); opacity: 0.5; }
 
        /* ── Alerts / Flash ── */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            display: flex; align-items: flex-start; gap: 10px;
            margin-bottom: 20px;
            border: 1px solid;
        }
        .alert-danger  { background: var(--red-dim);   border-color: #ff4d6a44; color: #ff8099; }
        .alert-warning { background: var(--amber-dim); border-color: #f5a62344; color: #f5c46a; }
        .alert-success { background: var(--green-dim); border-color: #00d4aa44; color: #40e0c0; }
        .alert-info    { background: var(--blue-dim);  border-color: #4d9fff44; color: #80baff; }
 
        /* ── Insight badges ── */
        .insight-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            border-left: 3px solid;
            font-size: 0.875rem;
        }
        .insight-danger  { background: var(--red-dim);   border-color: var(--red);   color: #ffb3bf; }
        .insight-warning { background: var(--amber-dim); border-color: var(--amber); color: #ffd080; }
        .insight-info    { background: var(--green-dim); border-color: var(--green); color: #80ffe8; }
 
        /* ── Tables ── */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .data-table thead th {
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }
        .data-table tbody td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }
        .data-table tbody tr:hover { background: var(--bg-hover); }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .td-pos { color: var(--green) !important; }
        .td-neg { color: var(--red)   !important; }
 
        /* ── Badges ── */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.06em;
        }
        .badge-win    { background: var(--green-dim); color: var(--green); }
        .badge-loss   { background: var(--red-dim);   color: var(--red);   }
        .badge-neutral{ background: var(--bg-hover);  color: var(--text-muted); }
 
        /* ── Section heading ── */
        .section-heading {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
 
        /* ── Divider ── */
        hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
 
        /* ── Page wrapper ── */
        .page-wrap { max-width: 1280px; margin: 0 auto; padding: 32px 32px; }
 
        /* ── Grid utilities ── */
        .grid-2  { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-3  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4  { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
 
        @media (max-width: 900px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .page-wrap { padding: 20px 16px; }
            .navbar { padding: 0 16px; }
        }
    </style>
 
    {% block head %}{% endblock %}
</head>
<body>
 
<nav class="navbar">
    <a href="/" class="navbar-brand">
        <div class="navbar-logo">
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                <polyline points="1,12 5,7 8,9 11,4 15,6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <span class="navbar-name">TradeFlow</span>
        <span class="navbar-tag">BETA</span>
    </a>
    <div class="navbar-right">
        {% block nav_right %}
        <a href="/" class="nav-link">Upload</a>
        {% endblock %}
    </div>
</nav>
 
{% block body %}{% endblock %}
 
{% block scripts %}{% endblock %}
</body>
</html>
